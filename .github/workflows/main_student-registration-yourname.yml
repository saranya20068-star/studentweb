name: Deploy HTML to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_792E31EA895C47EDA13735B3B20EB04F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C92C1F36565A42FCAB69BFAB91476A34 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_95A15376686C4A449FC330CFA3C77844 }}

      - name: Deploy HTML to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'student-registration-yourname'
          slot-name: 'Production'
          package: .
